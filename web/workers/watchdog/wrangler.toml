# Separate observation-only candidate. Never deploy this implicitly with playback.
name = "fotty-watchdog"
account_id = "4802f4dfeccd6893faeafa09827fd9ef"
main = "src/index.mjs"
compatibility_date = "2026-08-29"
compatibility_flags = [ "no_nodejs_compat", "no_nodejs_compat_v2", "enable_request_signal" ]
[triggers]
crons = [ "*/5 * * * *" ]
[vars]
# Activation is an owner gate, not a side effect of compiling or dry-running.
FOTTY_WATCHDOG_ENABLED = "0"
# Disabled source preparation only. Recipient verification, an onboarded sender
# domain and a fixed-destination binding are separate factual activation gates.
FOTTY_OWNER_EMAIL_ENABLED = "0"
# After those gates, use a private config with FOTTY_OWNER_EMAIL_ACTIVATED_AT,
# FOTTY_OWNER_EMAIL_RECIPIENT, FOTTY_OWNER_EMAIL_SENDER=watchdog@getfotty.com
# and [[send_email]] name=FOTTY_OWNER_EMAIL, destination_address=<verified owner>.
# Do not add an unrestricted binding or real owner address to this source file.
[[durable_objects.bindings]]
name = "WATCHDOG_STATE"
class_name = "WatchdogState"
[[migrations]]
tag = "watchdog-observation-v1"
new_sqlite_classes = [ "WatchdogState" ]
