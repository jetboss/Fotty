# Separate observation-only candidate. Never deploy this implicitly with playback.
name = "fotty-watchdog"
account_id = "4802f4dfeccd6893faeafa09827fd9ef"
main = "src/index.mjs"
compatibility_date = "2026-08-29"
compatibility_flags = [ "no_nodejs_compat", "no_nodejs_compat_v2", "enable_request_signal" ]
[triggers]
crons = [ "*/5 * * * *" ]
[vars]
# Activation is an owner gate, not a side effect of compiling or dry-running.
FOTTY_WATCHDOG_ENABLED = "0"
[[durable_objects.bindings]]
name = "WATCHDOG_STATE"
class_name = "WatchdogState"
[[migrations]]
tag = "watchdog-observation-v1"
new_sqlite_classes = [ "WatchdogState" ]
