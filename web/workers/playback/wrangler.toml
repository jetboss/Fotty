name = "fotty-playback-v3"
account_id = "4802f4dfeccd6893faeafa09827fd9ef"
main = "src/index.js"
compatibility_date = "2026-08-29"
compatibility_flags = [ "no_nodejs_compat", "no_nodejs_compat_v2" ]

# Deploy: cd web/workers/playback && npx wrangler deploy
# Then rebuild static site with:
#   NEXT_PUBLIC_FOTTY_API_BASE=https://fotty-playback.<account>.workers.dev npm run build:static

[vars]
# Set "0" to require a future access policy; default open for companion source lookup.
FOTTY_PLAYBACK_OPEN = "1"
FPL_COACH_MODEL = "deepseek-v4-flash"

[[durable_objects.bindings]]
name = "FOOTBALL_SCORE_BUDGET"
class_name = "FootballQuotaBudget"

[[migrations]]
tag = "football-score-budget-v1"
new_sqlite_classes = [ "FootballQuotaBudget" ]

[[ratelimits]]
name = "FPL_COACH_RATE_LIMITER"
namespace_id = "2026082201"

  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "FPL_COACH_CAPACITY_RATE_LIMITER"
namespace_id = "2026082202"

  [ratelimits.simple]
  limit = 120
  period = 60
