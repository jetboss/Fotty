# Audit-only configuration. Not an application lint/build policy.
# Emit every measurable body so the report can calculate a baseline.
only_rules:
  - cyclomatic_complexity
  - function_body_length
cyclomatic_complexity:
  warning: 0
  error: 10000
  ignores_case_statements: false
function_body_length:
  warning: 0
  error: 100000
