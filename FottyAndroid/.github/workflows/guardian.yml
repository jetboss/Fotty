name: Code Guardian

on:
  schedule:
    - cron: '0 0 * * *' # Nightly at midnight
  workflow_dispatch: # Manual trigger

jobs:
  guardian_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Code Guardian
        run: |
          chmod +x guardian/run.sh
          ./guardian/run.sh

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: guardian-report
          path: guardian/reports/latest.md
