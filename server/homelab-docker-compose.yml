# Canonical production stack for the Fotty homelab (AceStream host).
# Deploy with tools/p2p-proxy-deploy-homelab.sh; do not run a second scraper.

services:
  acestream-engine:
    image: vstavrinov/acestream-engine:3.1.75-4
    container_name: acestream-engine
    restart: always
    network_mode: host
    privileged: true
    shm_size: 4g
    devices:
      - /dev/dri:/dev/dri
    command:
      - /bin/bash
      - -c
      - "mkdir -p /dev/shm/.ACEStream && ./start-engine --client-console --max-connections 2000 --max-peers 1500 --live-cache-type memory --memory-cache-limit 2147483648 --use-ffmpeg 1"
    deploy:
      resources:
        limits:
          memory: 8192M
          cpus: '8.0'

  p2p-redis:
    image: redis:7-alpine
    container_name: p2p-redis
    restart: always
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--save", "60", "1"]
    volumes:
      - p2p_redis_data:/data

  fotty-p2p-proxy:
    image: fotty-p2p-proxy:latest
    container_name: fotty-p2p-proxy
    restart: always
    environment:
      - PORT=8006
      - GUNICORN_BIND=127.0.0.1:8006
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=16
      - GUNICORN_TIMEOUT=300
      - REDIS_URL=redis://127.0.0.1:6379/0
      - P2P_API_PASSWORD=${P2P_API_PASSWORD:?Set P2P_API_PASSWORD in your homelab .env}
      - P2P_UPSTREAM_BASE_URL=http://127.0.0.1:6878
      - P2P_UPSTREAM_KIND=engine
      - P2P_DASHBOARD_ENABLED=false
      - P2P_PREWARM_ENABLED=true
      - P2P_PREWARM_CHANNEL_SOURCE_URL=http://127.0.0.1:8006/matches
      - P2P_PREWARM_BASE_URL=https://p2p.pixel-invoice.com
      - P2P_PREWARM_LIMIT=4
      - P2P_PREWARM_CONCURRENT_LIMIT=1
    network_mode: host
    depends_on:
      - p2p-redis
      - acestream-engine

  fotty-brain-monitor:
    build:
      context: ..
      dockerfile: server/Dockerfile.brain-monitor
    container_name: fotty-brain-monitor
    restart: always
    network_mode: host
    environment:
      - OLLAMA_HOST=http://127.0.0.1:11434
    volumes:
      - ../docs/notebooklm:/app/docs/notebooklm:ro
      - ../agent:/app/agent:ro
      - ../.cursor/rules:/app/.cursor/rules:ro
      - ./brain-cache:/app/tools/brain/.cache

volumes:
  p2p_redis_data:
