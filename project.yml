name: Fotty
options:
  bundleIdPrefix: com.jelani
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

targets:
  Fotty:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    deploymentTarget: "26.4"
    sources:
      - path: Fotty
        excludes:
          - "**/.DS_Store"
          - Info.plist
          - '*.entitlements'
          - Resources/Manifests/**
          # Retired fantasy UI/engines; public score and legacy backup types stay.
          - Features/FPL/Models/FPLDecisionModels.swift
          - Features/FPL/Services/FPLAICoachService.swift
          - Features/FPL/Services/FPLAdvisorDataProvider.swift
          - Features/FPL/Services/FPLAdvisorDerivedStateBuilder.swift
          - Features/FPL/Services/FPLAdvisorEngine.swift
          - Features/FPL/Services/FPLAlertScheduler.swift
          - Features/FPL/Services/FPLChipAvailabilityPolicy.swift
          - Features/FPL/Services/FPLCoachAccessStore.swift
          - Features/FPL/Services/FPLDecisionEngine.swift
          - Features/FPL/Services/FPLManagerConnection.swift
          - Features/FPL/Services/FPLPlannerEngine.swift
          - Features/FPL/Services/FPLPlanningBounds.swift
          - Features/FPL/Services/FPLRivalSnapshot.swift
          - Features/FPL/Services/FPLSmartCoachService.swift
          - Features/FPL/Services/FPLSquadValidator.swift
          - Features/FPL/Services/FPLTransferRules.swift
          - Features/FPL/Services/FPLTransferStagingStore.swift
          - Features/FPL/Services/FPLWorkspaceEvidencePolicy.swift
          - Features/FPL/Services/FPLWorkspacePersistence.swift
          - Features/FPL/ViewModels/FPLAdvisorViewModel.swift
          - Features/FPL/Views/Components/FPLAICoachView.swift
          - Features/FPL/Views/Components/FPLCaptainPickerView.swift
          - Features/FPL/Views/Components/FPLCommandCenterView.swift
          - Features/FPL/Views/Components/FPLDecisionJournalView.swift
          - Features/FPL/Views/Components/FPLFixtureTrackerView.swift
          - Features/FPL/Views/Components/FPLLeagueStandingsView.swift
          - Features/FPL/Views/Components/FPLLiveTrackerView.swift
          - Features/FPL/Views/Components/FPLManagerInputView.swift
          - Features/FPL/Views/Components/FPLMultiGWPlannerView.swift
          - Features/FPL/Views/Components/FPLPlayerComparisonView.swift
          - Features/FPL/Views/Components/FPLPriceAlertsView.swift
          - Features/FPL/Views/Components/FPLRivalMatrixView.swift
          - Features/FPL/Views/Components/FPLSquadPitchView.swift
          - Features/FPL/Views/Components/FPLTransferHubView.swift
          - Features/FPL/Views/Components/FPLTransferLabView.swift
          - Features/FPL/Views/Components/FPLWildcardGeneratorView.swift
          - Features/FPL/Views/FPLMainView.swift
          - Features/Settings/Views/SettingsCoachAccessView.swift
      - path: Fotty/Info.plist
        buildPhase: none
      - path: Fotty/Resources/Manifests
        buildPhase: resources
        type: folder
    dependencies:
      - target: FottyLiveActivityExtension
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        DEVELOPMENT_TEAM: 9W3JDBQU39
        CODE_SIGN_ENTITLEMENTS: Fotty/Fotty.entitlements
        INFOPLIST_FILE: Fotty/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1,2
        MARKETING_VERSION: 3.0.0
        CURRENT_PROJECT_VERSION: 338
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  FottyLiveActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: FottyLiveActivityExtension
        excludes:
          - Info.plist
          - '*.entitlements'
      - path: FottyLiveActivityExtension/Info.plist
        buildPhase: none
      - path: Fotty/Core/LiveActivities/FottyMatchActivityAttributes.swift
      - path: Fotty/Core/Continuity/SportsWidgetSnapshot.swift
    settings:
      base:
        DEVELOPMENT_TEAM: 9W3JDBQU39
        INFOPLIST_FILE: FottyLiveActivityExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jelani.Fotty.LiveActivityExtension
        PRODUCT_NAME: FottyLiveActivityExtension
        CODE_SIGN_ENTITLEMENTS: FottyLiveActivityExtension/FottyLiveActivityExtension.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: 3.0.0
        CURRENT_PROJECT_VERSION: 338
  FottyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: FottyTests
        excludes:
          - Fixtures/VisualBaselines-206
          - Fixtures/VisualBaselines-273
          - Fixtures/VisualBaselines-Xcode27A266a
          - FPLCoachAccessTests.swift
          - FPLCoachEvidenceTests.swift
          - FPLMatchdayRefreshTests.swift
          - FPLPlanningBoundariesTests.swift
          - FPLRivalSnapshotTests.swift
          - FPLTransferPlanSafetyTests.swift
          - FPLTrustTests.swift
    dependencies:
      - target: Fotty
    settings:
      base:
        DEVELOPMENT_TEAM: 9W3JDBQU39
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jelani.FottyTests
        SWIFT_VERSION: 5.9
  FottyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: FottyUITests
    dependencies:
      - target: Fotty
    settings:
      base:
        DEVELOPMENT_TEAM: 9W3JDBQU39
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jelani.FottyUITests
        SWIFT_VERSION: 5.9

schemes:
  Fotty:
    build:
      targets:
        Fotty: all
        FottyTests: [test]
        FottyUITests: [test]
    test:
      targets:
        - FottyTests
        - FottyUITests
      environmentVariables:
        FOTTY_AUTOMATED_TESTING: "1"
    run:
      config: Debug
    archive:
      config: Release
  FottyFoundationUI:
    build:
      targets:
        Fotty: all
        FottyUITests: [test]
    test:
      config: Release
      targets:
        - FottyUITests
      environmentVariables:
        FOTTY_AUTOMATED_TESTING: "1"
    run:
      config: Release
    archive:
      config: Release
