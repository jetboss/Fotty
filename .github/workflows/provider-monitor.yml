name: Provider Metadata Monitor

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

# CPL validation lives in cpl-fixtures.yml (its --update run also validates the
# live feed) and Champions League readiness in ucl-match-window.yml.
permissions:
  contents: read

concurrency:
  group: provider-metadata-monitor
  cancel-in-progress: true

jobs:
  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate the deployed Worker contract and source identity
        run: node tools/audit-worker-health.mjs

  football-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate live Premier League and Champions League fixture feeds
        run: node tools/audit-football-fixture-feed.mjs

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate current provider football identities
        run: node tools/audit-provider-football-identity.mjs --live
