name: CPL Fixture Monitor

on:
  schedule:
    - cron: "47 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cpl-fixture-monitor
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Validate and refresh the reviewed CPL manifest
        run: node tools/audit-cpl-fixtures.mjs --update
      - name: Open or update a fixture review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- web/public/data/cpl-2026-fixtures.json; then
            echo "CPL schedule is current."
            exit 0
          fi

          branch="automation/cpl-fixtures"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add web/public/data/cpl-2026-fixtures.json
          git commit -m "chore: refresh CPL fixtures"
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: review current CPL fixture changes" \
              --body "The daily fail-closed CPL monitor found an official change independently confirmed by the current verifier. The generated 39-match manifest passed strict validation. This PR makes that live-verified change the durable Worker and offline iOS fallback; partial, structurally changed, or newly conflicting feeds are rejected."
          else
            echo "Updated existing CPL fixture PR #$existing."
          fi
