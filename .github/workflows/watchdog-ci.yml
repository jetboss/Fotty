name: Watchdog CI

on:
  push:
    branches: [main]
    paths: ["tools/watchdog/**", "web/workers/watchdog/**", ".github/workflows/watchdog-*.yml"]
  pull_request:
    paths: ["tools/watchdog/**", "web/workers/watchdog/**", ".github/workflows/watchdog-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observation-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Exercise incidents, source contracts, recovery and failed delivery offline
        run: node --test tools/watchdog/*.test.mjs
      - name: Install the locked deployment runtime
        run: npm ci --prefix web --ignore-scripts
      - name: Exercise the real Worker and transactional Durable Object
        run: node --test web/workers/watchdog/src/runtime.test.mjs
      - name: Verify an observation-only bundle without activation or credentials
        working-directory: web
        run: npx wrangler deploy --config workers/watchdog/wrangler.toml --dry-run --outdir "${RUNNER_TEMP}/watchdog-dry-run"
