name: iOS CI

on:
  # Pull requests to main (including the protected release PR) and pushes to
  # wip/** run the Catalyst suite here, so the 8 GB development Mac only needs
  # to run device checks.
  push:
    branches: [main, "wip/**"]
    paths:
      - "Fotty/**"
      - "FottyLiveActivityExtension/**"
      - "FottyTests/**"
      - "shared/reference-data/**"
      - "tools/generate-football-competition-catalog.mjs"
      - "tools/audit-provider-football-identity.mjs"
      - "tools/audit-cpl-fixtures.mjs"
      - "tools/ios-ci.sh"
      - "tools/check_native_source_membership.py"
      - "tools/tests/test_native_source_membership.py"
      - "project.yml"
      - "Fotty.xcodeproj/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "Fotty/**"
      - "FottyLiveActivityExtension/**"
      - "FottyTests/**"
      - "shared/reference-data/**"
      - "tools/generate-football-competition-catalog.mjs"
      - "tools/audit-provider-football-identity.mjs"
      - "tools/audit-cpl-fixtures.mjs"
      - "tools/ios-ci.sh"
      - "tools/check_native_source_membership.py"
      - "tools/tests/test_native_source_membership.py"
      - "project.yml"
      - "Fotty.xcodeproj/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Xcode 27 is required by Fotty's checked-in iOS 26.4 target. This runner is
    # ephemeral, so DerivedData cannot fill the development Mac.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulator-free iOS release gate
        run: ./tools/ios-ci.sh
        env:
          FOTTY_XCODE_JOBS: "2"
          FOTTY_CI_RESULT_DIR: ${{ runner.temp }}/FottyResults
          FOTTY_CATALYST_DEPLOYMENT_TARGET: "26.1"
      # The unit suite needs no secrets: provider API keys are empty in tests.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fotty-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/FottyResults
          if-no-files-found: ignore
          retention-days: 7
