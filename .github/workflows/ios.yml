name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "Fotty/**"
      - "FottyLiveActivityExtension/**"
      - "FottyTests/**"
      - "shared/reference-data/**"
      - "tools/generate-football-competition-catalog.mjs"
      - "tools/audit-provider-football-identity.mjs"
      - "tools/audit-cpl-fixtures.mjs"
      - "tools/ios-ci.sh"
      - "project.yml"
      - "Fotty.xcodeproj/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "Fotty/**"
      - "FottyLiveActivityExtension/**"
      - "FottyTests/**"
      - "shared/reference-data/**"
      - "tools/generate-football-competition-catalog.mjs"
      - "tools/audit-provider-football-identity.mjs"
      - "tools/audit-cpl-fixtures.mjs"
      - "tools/ios-ci.sh"
      - "project.yml"
      - "Fotty.xcodeproj/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Xcode 27 is required by Fotty's checked-in iOS 26.4 target. This runner is
    # ephemeral, so DerivedData cannot fill the development Mac.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulator-free iOS release gate
        run: ./tools/ios-ci.sh
        env:
          FOTTY_XCODE_JOBS: "2"
          FOTTY_CATALYST_DEPLOYMENT_TARGET: "26.0"
