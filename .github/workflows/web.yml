name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/reference-data/**"
      - "tools/generate-football-competition-catalog.mjs"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/reference-data/**"
      - "tools/generate-football-competition-catalog.mjs"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        # The current baseline has known warnings but no lint errors. Keep the
        # ceiling explicit so warning growth fails while cleanup proceeds.
        run: npm run lint -- --max-warnings 100

      - name: Worker dry run
        run: npm run worker:check

      - name: Build
        run: npm run build
        env:
          FOOTBALL_DATA_API_KEY: ci-placeholder
