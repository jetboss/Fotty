name: Independent Watchdog Observer
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_canary && 'Fotty watchdog delivery test — not collection' || 'Fotty watchdog observer' }}

on:
  schedule:
    # Intended cadence; GitHub schedules may be delayed. The independent chat
    # monitor checks actual completion age rather than treating cron as an SLA.
    - cron: "7,22,37,52 * * * *"
  workflow_run:
    # Reuse completed trusted monitors as additional notification opportunities.
    # This diversifies triggers; it is not an independent cloud/SLA guarantee.
    workflows: ["Sports Fixture Monitor", "Cricket Fixture Monitor", "Provider Metadata Monitor"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      delivery_canary:
        description: "Send one bot delivery test to the owner (no provider incident)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: independent-watchdog-observer-production
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.ref == 'refs/heads/main'
      && github.repository == 'jetboss/Fotty'
      && vars.FOTTY_WATCHDOG_ENABLED == '1'
      && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'main'
          && contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Never execute triggering-run code or consume its artifacts/caches.
          ref: refs/heads/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Check collector liveness and deliver durable changed-state owner alerts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOTTY_WATCHDOG_DELIVERY_CANARY: ${{ github.event.inputs.delivery_canary || 'false' }}
        run: node tools/watchdog/github-observer.mjs
