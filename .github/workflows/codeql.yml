name: CodeQL Interpreted

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "web/**"
      - "tools/**/*.js"
      - "tools/**/*.cjs"
      - "tools/**/*.mjs"
      - "tools/**/*.ts"
      - "tools/**/*.tsx"
      - "tools/**/*.py"
      - "test_scraper.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "web/**"
      - "tools/**/*.js"
      - "tools/**/*.cjs"
      - "tools/**/*.mjs"
      - "tools/**/*.ts"
      - "tools/**/*.tsx"
      - "tools/**/*.py"
      - "test_scraper.py"
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-interpreted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
